# WeatherBuyEnd Phase-1 — NO-eliminated sleeve (paper default)
mode: paper  # paper | live  (live also requires LIVE_TRADING=true)

bankroll_usd: 500
base_stake_usd: 10
stake_mult: 1.0

no_eliminated:
  enabled: true
  max_hours_to_noon: 6
  min_no_price: 0.80
  max_no_price: 0.985
  min_net_edge: 0.015
  p_no_if_eliminated: 0.99
  require_eliminated: true

execution:
  order_type: FOK  # FOK | IOC — taker only
  max_slippage: 0.02
  size_to_book_depth: true

risk:
  max_markets_per_day: 40
  max_markets_concurrent: 25
  max_daily_notional_usd: 500
  max_per_fill_usd: 50
  max_daily_loss_usd: 100
  max_metar_age_minutes: 45
  max_venue_error_rate: 0.25

loop:
  metar_poll_sec: 30
  book_poll_sec: 5
  market_refresh_sec: 120

paths:
  cities: config/cities.yaml
  ledger_dir: data/ledger
