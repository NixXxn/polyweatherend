# WeatherBuyEnd Live — Coolify-ready stack (Polymarket CLOB)
# Local: docker compose up --build
# Unified image serves UI+API on :3847

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - weatherbuy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3847:3847"
    environment:
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "3847"
      PORT: "3847"
      TRADING_MODE: ${TRADING_MODE:-live}
      LIVE_TRADING: ${LIVE_TRADING:-true}
      MOCK_MARKETS: ${MOCK_MARKETS:-false}
      KILL_SWITCH: ${KILL_SWITCH:-true}
      BUDGET_USD: ${BUDGET_USD:-500}
      CITY_ROLES: ${CITY_ROLES:-paper,strict,metar}
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY:-}
      POLY_API_KEY: ${POLY_API_KEY:-}
      POLY_API_SECRET: ${POLY_API_SECRET:-}
      POLY_API_PASSPHRASE: ${POLY_API_PASSPHRASE:-}
      POLY_SIGNATURE_TYPE: ${POLY_SIGNATURE_TYPE:-3}
      POLY_FUNDER: ${POLY_FUNDER:-}
      POLY_CLOB_HOST: ${POLY_CLOB_HOST:-https://clob.polymarket.com}
      POLY_GAMMA_URL: ${POLY_GAMMA_URL:-https://gamma-api.polymarket.com}
      POLY_CHAIN_ID: ${POLY_CHAIN_ID:-137}
    volumes:
      - weatherbuy_ledger:/app/data/ledger
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3847/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  weatherbuy_redis:
  weatherbuy_ledger:
